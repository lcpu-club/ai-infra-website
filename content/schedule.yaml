  - id: topic-1-session-03
    type: lecture
    topic: kernel
    sessions: ["03"]
    title:
      zh: "Topic 1, Session 3 | Tensor Core"
      en: "Topic 1, Session 3 | Tensor Core"
    description:
      zh: >-
        本讲以 Tensor Core 的硬件与编程模型为主线，贯穿 mma.sync（Ampere）、
        wgmma（Hopper）和 tcgen05（Blackwell）三代指令的演进，从数据搬运与
        发射带宽推导 Tensor Core 的设计逻辑，理解 fragment 布局以及使用
        layout 与 swizzle 解决 bank conflict 的方法，最后以 FP8
        fine-grained scaling 介绍低精度 Tensor Core 的使用。
      en: >-
        This session explores the hardware and programming model of Tensor Cores,
        tracing the evolution of mma.sync on Ampere, wgmma on Hopper, and tcgen05 on
        Blackwell. We derive the design logic of Tensor Cores from data movement and
        issue bandwidth, study fragment layouts, and learn how layouts and swizzles
        can resolve bank conflicts. We conclude with the use of low-precision Tensor
        Cores through FP8 fine-grained scaling.
    start: "2026-08-02T19:00:00+08:00"
    end: "2026-08-02T22:00:00+08:00"
    confirmation: confirmed
    speakers:
