      en: "Topic 1: Kernel & ML Compiler — First Seminar"
    description:
      zh: |-
        Session 1.0 从 HPC 到 AI Infra：并行计算与并行编程
        Session 1.1 CUDA 编程模型
        Session 1.2 Triton/TileLang Tile Level 编程
        介绍活动整体安排、内容设计、评测与算力资源。
      en: |-
        Session 1.0 From HPC to AI Infra: Parallel Computing and Parallel Programming
        Session 1.1 CUDA Programming Model
        Session 1.2 Triton/TileLang Tile Level Programming
        Seminar overview, curriculum design, evaluation, and computing resources.
    start: "2026-07-26T18:00:00+08:00"
