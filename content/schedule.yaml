  - id: topic-2-workshop-02
    type: workshop
    topic: comm
    sessions: ["02"]
    title:
      zh: "Topic 2, Workshop 2 | AI Communication Stack"
      en: "Topic 2, Workshop 2 | AI Communication Stack"
    description:
      zh: >-
        Pipeline 背后真正的问题是：谁来决定什么工作在什么时候、在哪个资源上执行？谁负责维护依赖、推进执行，并判断一个阶段何时真正完成？
        这其中涉及到一组连续的设计 trade-off：硬件与软件的责任划分、编程复杂度与硬件复杂度、静态与动态调度、显式控制与自动管理、
        灵活性与可预测性，以及细粒度重叠带来的性能收益与状态和同步开销。在单 GPU 内部，这些责任可以由 Compiler、Warp Scheduler、
        Scoreboard、Pipeline、Barrier、Copy Engine 和 Memory Hierarchy 共同承担。我们关注数据如何在 Register、Shared Mem、片上专用存储和 HBM 之间流动并保证计算正确推进。
        今天，我们把同一个问题扩展到 GPU-to-GPU 高速互联。此时数据的 Producer 和 Consumer 不再位于同一块 GPU 上，数据可能需要跨越 GPU Fabric、
        NVLink / NVSwitch、PCIe、RNIC、RDMA Transport 和交换网络。原本局限在单 GPU 内部的 Readiness、Ordering、Completion 和 Visibility，
        现在必须跨越不同的设备、地址域、队列、协议乃至故障域继续成立。我们今天讨论这些状态和控制责任应该放在哪里，并介绍 Workload 中对通信的要求以及工业界一些经典的解决方案。
        本次活动无课前阅读。
      en: >-
        The central question behind a pipeline is: who decides what work runs, when it runs, and on which resource?
        Who maintains dependencies, advances execution, and determines when a stage has truly completed?
        These questions involve trade-offs between hardware and software responsibility, programming and hardware complexity,
        static and dynamic scheduling, explicit control and automation, flexibility and predictability, and the performance gains
        of fine-grained overlap versus its state and synchronization costs. Inside a single GPU, Compiler, Warp Scheduler,
        Scoreboard, Pipeline, Barrier, Copy Engine, and Memory Hierarchy share these responsibilities. We study how data moves
        among Registers, Shared Memory, on-chip specialized storage, and HBM while computation progresses correctly.
        We then extend the same problem to high-speed GPU-to-GPU interconnects, where Producer and Consumer may reside on different GPUs
        and data may cross GPU Fabric, NVLink / NVSwitch, PCIe, RNIC, RDMA Transport, and switching networks. This session examines
        where Readiness, Ordering, Completion, and Visibility responsibilities should live across devices, address domains, queues,
        protocols, and failure domains, and introduces communication requirements in workloads and classic industry solutions.
        No pre-reading is required.
    start: "2026-08-23T19:30:00+08:00"
    end: "2026-08-23T21:30:00+08:00"
