  - id: topic-1-session-02
    type: lecture
    topic: kernel
    sessions: ["02"]
    title:
      zh: "Topic 1, Session 2：Memory Abstraction & Hierarchy"
      en: "Topic 1, Session 2: Memory Abstraction & Hierarchy"
    description:
      zh: >-
        本讲以 CUDA Core FP32 GEMM 为主线，从计算语义出发理解 data reuse
        与 memory hierarchy 的抽象；从 strawman GEMM 演进到 tiling，并使用
        Roofline Model 分析数据复用；再从硬件视角理解 SM、warp 执行、
        coalescing、latency hiding、shared memory bank conflict、padding、
        swizzle 与 per-thread microtile，最后使用 Nsight Compute 完成一个
        Kernel 的编写与调优。
    start: "2026-07-30T19:30:00+08:00"
    end: "2026-07-30T21:30:00+08:00"
    confirmation: confirmed
    speakers:
      - name:
          zh: 周宇轩
          en: Yuxuan Zhou
      - name:
          zh: 林若瑜
          en: Ruoyu Lin
    locations:
      - label:
          zh: 腾讯会议
          en: Tencent Meeting
      - label:
          zh: B站直播
          en: Bilibili Live
      - label:
          zh: LCPU Live
          en: LCPU Live
        href: https://live.lcpu.dev
    links: []
    assignments: []
    display:
      homepage: true
      calendar: true
      accent: kernel

  - id: topic-1-session-03
    type: lecture
    topic: kernel
    sessions: ["03"]
    title:
      zh: "Topic 1, Session 3：Tensor Core"
      en: "Topic 1, Session 3: Tensor Core"
    description:
      zh: >-
        本讲以 Tensor Core 的硬件与编程模型为主线，贯穿 mma.sync（Ampere）、
        wgmma（Hopper）和 tcgen05（Blackwell）三代指令的演进，从数据搬运与
        发射带宽推导 Tensor Core 的设计逻辑，理解 fragment 布局以及使用
        layout 与 swizzle 解决 bank conflict 的方法，最后以 FP8
        fine-grained scaling 介绍低精度 Tensor Core 的使用。
    start: "2026-08-02T19:00:00+08:00"
    end: "2026-08-02T22:00:00+08:00"
    confirmation: confirmed
    speakers:
      - name:
          zh: 孙远航
          en: Yuanhang Sun
    locations:
      - label:
          zh: 腾讯会议
          en: Tencent Meeting
      - label:
          zh: B站直播
          en: Bilibili Live
      - label:
          zh: LCPU Live
          en: LCPU Live
        href: https://live.lcpu.dev
    links: []
    assignments: []
    display:
      homepage: true
      calendar: true
      accent: kernel

