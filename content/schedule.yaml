  - id: topic-2-session-05
    type: lecture
    topic: comm
    sessions: ["05"]
    title:
      zh: "Topic 2, Session 5 | Towards Modern Networking System"
      en: "Topic 2, Session 5 | Towards Modern Networking System"
    description:
      zh: >-
        随着计算量的不断增加，单个计算单元已无法满足更大的计算需求，这要求我们必须采用某些方式将计算单元连接起来。
        历史上，总线、PCIe、TCP/IP、Ethernet 等，都从不同方面不同层次对互联中关键的问题进行了回答。
        AI 时代，为了承载 HPC/AI Workload 中大规模并行计算所需要的通信和互联，我们需要更大的带宽、更低的延迟、更高的可靠性，
        迫使我们不断设计和改进网络系统。本节课，我们将从通信需求的产生开始，试图从第一性原理出发，逐步解释现代网络系统的组成与设计。
        本次活动无课前阅读。
      en: >-
        As computational demands continue to grow, a single compute unit is no longer enough;
        we need ways to connect compute units together. Historically, buses, PCIe, TCP/IP, and Ethernet
        have answered key interconnect questions at different layers. In the AI era, large-scale HPC/AI
        workloads demand higher bandwidth, lower latency, and greater reliability, driving the evolution
        of network systems. Starting from the origin of communication requirements, this session explains
        the composition and design of modern network systems from first principles. No pre-reading is required.
    start: "2026-08-17T19:30:00+08:00"
    end: "2026-08-17T21:30:00+08:00"
    confirmation: confirmed
    speakers:
