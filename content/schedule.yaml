  - id: topic-1-session-02
    type: lecture
    topic: kernel
    sessions: ["02"]
    title:
      zh: "Topic 1, Session 2 | Memory Abstraction & Hierarchy"
      en: "Topic 1, Session 2 | Memory Abstraction & Hierarchy"
    description:
      zh: >-
        本讲以 CUDA Core FP32 GEMM 为主线，从计算语义出发理解 data reuse
        与 memory hierarchy 的抽象；从 strawman GEMM 演进到 tiling，并使用
        Roofline Model 分析数据复用；再从硬件视角理解 SM、warp 执行、
        coalescing、latency hiding、shared memory bank conflict、padding、
        swizzle 与 per-thread microtile，最后使用 Nsight Compute 完成一个
        Kernel 的编写与调优。
      en: >-
        This session follows CUDA Core FP32 GEMM to develop an intuition for data reuse
        and the abstraction of the memory hierarchy. We start from a strawman GEMM,
        evolve it through tiling, and use the Roofline Model to analyze data reuse.
        From the hardware perspective, we then study SMs, warp execution, coalescing,
        latency hiding, shared-memory bank conflicts, padding, swizzle, and per-thread
        microtiles. Finally, we write and tune a kernel with Nsight Compute.
    start: "2026-07-30T19:30:00+08:00"
    end: "2026-07-30T21:30:00+08:00"
    confirmation: confirmed
    speakers:
      - name:
